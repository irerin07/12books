server:
  # 플랫폼이 포트를 정해 주는 곳(Railway·Render 등)은 PORT로 알려 준다. 없으면 8080.
  port: ${PORT:8080}
  # 전달 헤더를 믿을지. **기본은 믿지 않는다.**
  #
  # 켜면 프록시 뒤에서 원래 클라이언트 주소를 볼 수 있어 IP로 세는 요청 제한이 제대로 돈다.
  # 그런데 켜는 순간 그 헤더를 믿게 되므로, 프록시가 클라이언트가 보낸 X-Forwarded-For를
  # 지우고 다시 쓰지 않으면 헤더 한 줄로 제한을 우회할 수 있다. 앱에 직접 닿는 경로가
  # 열려 있어도 마찬가지다.
  #
  # 그 보장은 배포 환경마다 다르므로 환경변수로만 켠다. 기본값을 켜 두면 보장이 없는 곳에서
  # 조용히 뚫린다 — 안 켜면 "모두가 한 버킷"이라 과하게 막힐 뿐이고, 잘못 켜면 아예 안 막힌다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: twelvebooks
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마의 단일 진실 공급원은 Flyway다
    open-in-view: false           # 지연 로딩이 뷰까지 새는 것을 막는다
    properties:
      hibernate:
        default_batch_fetch_size: 100   # N+1 1차 방어선
  flyway:
    enabled: true
    # baseline-on-migrate는 켜지 않는다. 히스토리가 없는 DB를 baseline으로 찍어버리면
    # 실제로는 적용된 적 없는 V1이 적용된 것으로 취급돼 마이그레이션 누락이 조용히 숨는다.

twelvebooks:
  # 브라우저에서 이 API를 부를 수 있는 오리진. 쉼표로 구분한다.
  # 비워 두면 CORS를 아예 열지 않는다 — 깜빡한 것이 전면 개방으로 이어지면 안 된다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # 프런트가 다른 사이트에 뜨는 배포에서만 None으로 낮춘다. 낮추면 이 쿠키의 CSRF 방어가
    # 사라지므로 그 결정이 배포 설정에 남아야 한다.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    password-reset:
      # 링크를 오래 살려 두면 메일함을 한 번 들여다본 사람이 계정을 가져간다. 짧으면 다시
      # 요청하면 그만이라, 기울기가 한쪽으로 분명하다.
      ttl: ${PASSWORD_RESET_TTL:PT30M}
      # 토큰을 붙일 프런트 주소. 백엔드가 아니라 화면이 받아야 한다 — 사용자는 링크를 눌러
      # 새 비밀번호를 입력할 곳으로 가야지, JSON을 보면 안 된다.
      link-base: ${PASSWORD_RESET_LINK_BASE:http://localhost:3000/reset-password}
      # 보내는 주소. 아무 주소나 쓸 수 없다 — SMTP 서버가 허용한 계정·도메인이어야 하고,
      # 아니면 거부되거나 스팸으로 분류된다.
      from: ${MAIL_FROM:no-reply@12books.local}
  mail:
    # 메일 발송자. 비워 두면 발송이 실패하는데, 요청은 그래도 204다(계정 유무를 흘리지
    # 않으려고 발송과 응답을 분리했다) — 즉 **조용히 안 나간다.** 로그의 경고가 유일한 신호다.
    resend:
      api-key: ${RESEND_API_KEY:}
  book:
    signature-secret: ${BOOK_SIGNATURE_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT10M
    refresh-token-ttl: P14D
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    base-url: https://dapi.kakao.com
    max-concurrent-calls: 8
