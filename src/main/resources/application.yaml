spring:
  application:
    name: twelvebooks
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마의 단일 진실 공급원은 Flyway다
    open-in-view: false           # 지연 로딩이 뷰까지 새는 것을 막는다
    properties:
      hibernate:
        default_batch_fetch_size: 100   # N+1 1차 방어선
  flyway:
    enabled: true
    # baseline-on-migrate는 켜지 않는다. 히스토리가 없는 DB를 baseline으로 찍어버리면
    # 실제로는 적용된 적 없는 V1이 적용된 것으로 취급돼 마이그레이션 누락이 조용히 숨는다.

twelvebooks:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    base-url: https://dapi.kakao.com
