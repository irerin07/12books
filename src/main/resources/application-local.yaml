# docker-compose로 띄운 로컬 인프라를 가리킨다.
# 비밀값(JWT_SECRET, KAKAO_REST_API_KEY)은 파일에 넣지 않고 환경변수로만 주입한다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/twelvebooks?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
