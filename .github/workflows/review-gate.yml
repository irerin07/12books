name: review-gate

# 사람의 승인 없이는 머지되지 않게 만드는 게이트.
#
# GitHub은 PR 작성자가 자기 PR을 approve하는 것을 금지한다. 1인 저장소에서
# "필수 승인 1건"을 걸면 모든 PR이 영구히 막히므로, 승인 신호를 저장소 소유자의
# "/approve <커밋 SHA>" 코멘트로 받아 커밋 상태(status)로 변환한다.
#
# ── 이 워크플로가 이벤트 순서에 의존하지 않는 이유 ────────────────────────────
# 어떤 이벤트로 깨어나든 "지금 head가 승인되어 있는가"를 **매번 처음부터 다시
# 계산한다.** 코멘트와 리뷰를 전부 읽어 시간순으로 정렬하고 마지막 지시를 따른다.
#
# 그래서 concurrency가 pending run을 갈아치우거나, 이벤트가 순서 없이 도착하거나,
# 아예 하나 유실되어도 결과가 틀어지지 않는다. 각 실행은 자기가 본 head에 대해
# "그 head의 진실"을 쓰고, 상태는 SHA별로 붙으므로 지나간 커밋에 쓴 값은 현재
# head의 판정에 영향을 주지 않는다.
#
# 승인이 커밋을 명시하는 것도 같은 이유다. 커밋 시각(committer.date)은 push
# 시각이 아니라서 시간 비교로는 "이 승인이 이 코드에 대한 것인가"를 알 수 없다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  statuses: write
  pull-requests: write

# 정확성이 여기에 걸려 있지는 않다(위 설명 참고). API 호출을 줄이려는 것뿐이다.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # issue_comment는 이슈에도 달리므로 PR에 달린 것만 처리한다
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: 현재 head의 승인 상태를 다시 계산해 반영
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          short_sha=${head_sha:0:7}
          echo "PR #$PR_NUMBER  head=$head_sha"

          directives=$(mktemp)

          # 승인 권한은 저장소 소유자와 쓰기 권한 협업자에게만 있다.
          #
          # 코멘트: "/approve <sha>" 와 "/reject". 첫 줄만 본다.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '
            .[]
            | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
            | . as $c
            | ($c.body | split("\n")[0] | sub("^[ \t]+"; "") | sub("[ \t\r]+$"; "")) as $line
            | select($line | test("^/(approve|reject)([ \t]|$)"))
            | "\($c.created_at)\tCOMMENT\t\($line)"
          ' >> "$directives" || true

          # 리뷰: 다른 사람이 approve한 경우. 리뷰는 대상 커밋(commit_id)을 스스로 들고 있다.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate --jq '
            .[]
            | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
            | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")
            | "\(.submitted_at)\tREVIEW\t\(.state)\t\(.commit_id)"
          ' >> "$directives" || true

          # 시간순으로 훑어 마지막 지시를 남긴다.
          verdict=""
          detail=""
          saw_bare_approve=0

          while IFS=$'\t' read -r ts kind rest extra; do
            [ -n "${ts:-}" ] || continue
            case "$kind" in
              COMMENT)
                # rest 예: "/approve a1b2c3d" 또는 "/reject"
                cmd=$(printf '%s' "$rest" | awk '{print $1}')
                arg=$(printf '%s' "$rest" | awk '{print $2}')
                if [ "$cmd" = "/reject" ]; then
                  verdict="failure"; detail="변경 요청됨 — 수정 후 /approve $short_sha"
                elif [ "$cmd" = "/approve" ]; then
                  if [ -z "$arg" ] || [ ${#arg} -lt 7 ]; then
                    saw_bare_approve=1
                  elif [ "${head_sha#"$arg"}" != "$head_sha" ]; then
                    # arg가 현재 head의 접두사다 = 이 커밋을 승인한 것
                    verdict="success"; detail="승인됨 — $arg"
                  fi
                  # 다른 커밋을 가리키는 승인은 무시한다(지나간 승인)
                fi
                ;;
              REVIEW)
                if [ "$extra" = "$head_sha" ]; then
                  if [ "$rest" = "APPROVED" ]; then
                    verdict="success"; detail="승인됨 — 리뷰 approve"
                  else
                    verdict="failure"; detail="변경 요청됨 — 수정 후 /approve $short_sha"
                  fi
                fi
                ;;
            esac
          done < <(sort "$directives")

          if [ -z "$verdict" ]; then
            verdict="failure"
            detail="승인 대기 중 — PR에 \"/approve $short_sha\" 코멘트를 남기면 자동 머지됩니다"
          fi

          echo "$verdict: $detail"

          gh api "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state="$verdict" \
            -f context="review-gate" \
            -f description="${detail:0:139}" \
            -f target_url="$RUN_URL" \
            --silent

          # 커밋을 안 적은 /approve 는 승인으로 치지 않는다. 그대로 두면 왜 안 되는지
          # 알 수 없으니, 복사해 쓸 수 있는 형태로 한 번 알려준다.
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$saw_bare_approve" = "1" ] && [ "$verdict" != "success" ]; then
            first_line=$(printf '%s' "$COMMENT_BODY" | head -n 1 | tr -d '\r' | sed 's/^[[:space:]]*//')
            case "$first_line" in
              /approve*)
                # 본문을 파일로 만들어 넘긴다. run 블록 안에서 여러 줄 문자열을 그대로 쓰면
                # 들여쓰기가 YAML 블록 스칼라를 벗어나 워크플로가 통째로 깨진다.
                printf '%s\n' "승인하려면 대상 커밋을 함께 적어주세요:" "" '```' "/approve $short_sha" '```' "" "커밋을 명시해야 하는 이유는, 승인 직후 새 커밋이 올라왔을 때 옛 승인이 새 코드를 승인해버리는 것을 막기 위해서입니다." > approve-help.md
                gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file approve-help.md
                ;;
            esac
          fi
