name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 이 job 이름이 그대로 필수 상태 체크 이름이 된다. ruleset(.github/ruleset-main.json)과 함께 바꿀 것.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 전체 테스트
        run: ./gradlew build --no-daemon
        env:
          # 통합 테스트용 더미값. 실제 비밀값이 아니며, Testcontainers가 DB/Redis를 직접 띄운다.
          # ubuntu-latest 러너에는 Docker가 이미 있으므로 별도 service 컨테이너가 필요 없다.
          JWT_SECRET: ci-only-dummy-secret-at-least-32-bytes-long
          KAKAO_REST_API_KEY: ci-only-dummy-kakao-key

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
