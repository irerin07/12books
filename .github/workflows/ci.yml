name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 이 job 이름이 그대로 필수 상태 체크 이름이 된다. ruleset(.github/ruleset-main.json)과 함께 바꿀 것.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 전체 테스트
        run: ./gradlew build --no-daemon
        env:
          # 통합 테스트용 더미값. 실제 비밀값이 아니며, Testcontainers가 DB/Redis를 직접 띄운다.
          # ubuntu-latest 러너에는 Docker가 이미 있으므로 별도 service 컨테이너가 필요 없다.
          JWT_SECRET: ci-only-dummy-secret-at-least-32-bytes-long
          KAKAO_REST_API_KEY: ci-only-dummy-kakao-key

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  # 브랜치 보호 훅도 코드다. 회귀하면 요구사항 3(브랜치 분리 강제)이 조용히 무너진다.
  # Windows PowerShell 5.1에서 도는 스크립트라 windows 러너가 필요하다.
  hook-tests:
    name: hook-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: guard-main 훅 테스트
        shell: powershell
        run: .\.claude\hooks\guard-main.tests.ps1

      # 워크플로 YAML이 깨지면 그 체크는 아예 나타나지 않는다. 머지는 막히지만(fail-safe)
      # 원인이 보이지 않으니, 파싱만이라도 여기서 확인한다.
      - name: 워크플로 YAML 파싱
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
                  print('OK  ', p)
              except Exception as e:
                  bad.append(p); print('FAIL', p, e)
          sys.exit(1 if bad else 0)
          PY
